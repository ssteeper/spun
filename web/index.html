<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060c">
  <meta name="description" content="Watch Australian spiders build their webs, thread by thread.">
  <title>Spun, not drawn — orb weavers &amp; snares</title>
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar" aria-label="Viewer controls">
      <a class="brand" href="./" aria-label="Spun, not drawn home">
        <span class="brand-title">Spun, not drawn</span>
        <span class="brand-subtitle">Orb weavers &amp; snares</span>
      </a>
      <nav class="species-area" aria-label="Choose a spider">
        <div class="species-rows" id="species-rows" role="radiogroup" aria-label="Spider species"></div>
      </nav>
      <div class="status-pill" id="status-pill" aria-hidden="true">Choose a web, then plant it on the stage.</div>
      <div class="control-group" role="radiogroup" aria-label="Lighting mode" id="mode-group">
        <button class="segment" type="button" role="radio" aria-checked="true" tabindex="0" data-value="dusk">Dusk</button>
        <button class="segment" type="button" role="radio" aria-checked="false" tabindex="-1" data-value="dawn">Dawn</button>
      </div>
      <button class="scene-button" id="scene-button" type="button" aria-expanded="false" aria-controls="scene-panel">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 1.6v2.6M10 15.8v2.6M1.6 10h2.6M15.8 10h2.6M4.1 4.1l1.8 1.8M14.1 14.1l1.8 1.8M4.1 15.9l1.8-1.8M14.1 5.9l1.8-1.8"/></svg>
        <span>Scene</span>
      </button>
      <button class="clear-button" id="clear-button" type="button">Clear <kbd>Esc</kbd></button>
    </header>
    <section class="stage" id="stage" aria-label="Web building stage">
      <canvas id="gl-canvas" class="inactive" aria-hidden="true"></canvas>
      <canvas id="web-canvas" tabindex="0" aria-label="A stage where spider webs are planted and built. Click or tap to plant the selected spider web; press Enter or Space while focused to plant at the centre. Press Escape to clear."></canvas>
      <canvas id="overlay-canvas" aria-hidden="true"></canvas>
      <p class="stage-hint" id="stage-hint">Choose a species, then click anywhere to plant.</p>
      <div class="zoom-hud" id="zoom-hud" role="group" aria-label="Zoom" hidden>
        <button type="button" class="zoom-button" id="zoom-out" aria-label="Zoom out"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9"/></svg></button>
        <span class="zoom-level" id="zoom-level">1.0×</span>
        <button type="button" class="zoom-button" id="zoom-in" aria-label="Zoom in"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9"/></svg></button>
        <button type="button" class="zoom-fit" id="zoom-reset">Fit</button>
      </div>
    </section>
    <aside class="scene-panel" id="scene-panel" aria-label="Scene settings" hidden></aside>
    <span class="sr-only" id="live-status" role="status" aria-live="polite" aria-atomic="true"></span>
  </main>
</body>
</html>
